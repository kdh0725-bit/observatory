name: 상품 페이지 생성

on:
  schedule:
    # 배치(01:10·13:10 KST)가 끝난 뒤에 돈다. cron 은 UTC 기준.
    - cron: '40 16 * * *'   # 01:40 KST
    - cron: '40 4 * * *'    # 13:40 KST
  workflow_dispatch:        # 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 상품 페이지·사이트맵 생성
        env:
          # 마지막 관측일이 이 일수를 넘긴 상품은 페이지를 접는다(레포 비대 방지).
          # 줄이면 용량이 줄고, 늘리면 검색에 남는 기간이 길어진다.
          RETENTION_DAYS: '90'
        run: node scripts/build-pages.mjs

      - name: 레포 용량 점검
        run: |
          # ★ 조용히 커지다가 어느 날 GitHub 경고 메일을 받는 걸 막는다.
          #    .git 히스토리가 실제 부담이라 워킹트리와 따로 잰다.
          PAGES=$(du -sm p 2>/dev/null | cut -f1)
          GITDIR=$(du -sm .git 2>/dev/null | cut -f1)
          echo "페이지 ${PAGES}MB · .git ${GITDIR}MB"
          if [ "${GITDIR:-0}" -gt 700 ]; then
            echo "::warning::.git 이 ${GITDIR}MB 입니다. RETENTION_DAYS 를 줄이거나 히스토리 정리를 검토하세요."
          fi

      - name: 변경분만 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add p sitemap.xml data/archive.json
          # ★ 바뀐 게 없으면 커밋하지 않는다. 빈 커밋이 쌓이면 히스토리가 쓸모없어진다.
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "상품 페이지 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
